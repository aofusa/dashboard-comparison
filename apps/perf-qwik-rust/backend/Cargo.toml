[package]
name = "perf_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
arrow = { version = "58", default-features = false, features = ["ipc"] }
arrow-ipc = "58"
async-trait = "0.1"
async-graphql = { version = "7", features = ["apollo_persisted_queries", "dataloader"] }
base64 = "0.22"
async-graphql-axum = "7"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-dynamodb = "1"
axum = "0.8"
argon2 = { version = "0.5", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15"
hex = "0.4"
jsonwebtoken = "9"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
sha2 = "0.10"
time = { version = "0.3", features = ["serde-well-known"] }
tower-sessions = { version = "0.15", default-features = false, features = ["axum-core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
