[package]
name = "perf_pingora_proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "perf-qwik-rust: Pingora reverse proxy (HTTP/1.1, /graphql → /api/graphql)"

[[bin]]
name = "perf_pingora_proxy"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
env_logger = "0.11"
http = "1"
log = "0.4"
pingora-core = "0.8"
pingora-error = "0.8"
pingora-http = "0.8"
pingora-proxy = "0.8"
