# 仕様 v4.1.1: app + MySQL + Nginx（3 サービス）
# Docker の起動は行わない前提でファイルのみ配置。利用時: docker compose -f infra/docker-compose.yml up -d

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: leanroot
      MYSQL_DATABASE: lean_app
    ports:
      - "3307:3306"
    volumes:
      - lean_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  app:
    image: node:20-bookworm
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      DATABASE_URL: mysql://root:leanroot@db:3306/lean_app
      AUTH_SECRET: change-me-in-production
      AUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-in-production
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - db
    command: ["sh", "-c", "npm install && npm run dev -- -H 0.0.0.0"]

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  lean_mysql_data:
